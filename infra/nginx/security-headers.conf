# Header keamanan bersama.
#
# Dipasang di /etc/nginx/snippets/, BUKAN /etc/nginx/conf.d/: berkas .conf di
# conf.d ikut dimuat otomatis nginx sebagai konfigurasi http, sehingga
# header-nya terpasang dua kali.
#
# WAJIB di-include ulang di setiap `location` yang memakai `add_header`
# sendiri: nginx hanya mewarisi add_header dari level atas bila level ini
# tidak punya add_header sama sekali. Satu `add_header Cache-Control` di
# dalam location sudah cukup membuang seluruh header keamanan di bawahnya.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Kamera dipakai halaman kios absensi wajah, lokasi dipakai aplikasi.
# Sisanya ditutup.
add_header Permissions-Policy
    "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()"
    always;

# HSTS hanya berarti di atas HTTPS. Di server HTTP ia diabaikan browser,
# jadi aman disertakan di sini dan otomatis aktif begitu TLS dipasang.
# `preload` sengaja TIDAK dipakai: pendaftaran preload list sulit dibatalkan
# dan mengunci seluruh subdomain disdik ke HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
