# =====================================================================
# Reverse proxy penyatu.
#
# Satu hostname melayani tiga aplikasi:
#
#   /                 -> aplikasi Jargon GO (Flutter web)
#   /admin/*          -> dashboard Laravel
#   /v1/*, /docs, ... -> API Rust
#
# MENGAPA SATU HOSTNAME, BUKAN TIGA PORT
#
# 1. Aplikasi web dan API berada di origin yang SAMA, sehingga CORS tidak
#    berlaku sama sekali. Tidak ada daftar origin yang harus dijaga tetap
#    sinkron dengan port yang sedang dipakai.
# 2. Aplikasi mengambil alamat API dari origin halamannya sendiri, jadi
#    image yang sama bekerja di localhost, di IP LAN, maupun di balik nama
#    domain — tanpa dibangun ulang.
# 3. Tablet dan aplikasi mobile hanya perlu mengetahui satu alamat, dan
#    sertifikat TLS hanya dikelola di satu tempat.
# =====================================================================

# ---------------------------------------------------------------------
# Host diteruskan sebagai $http_host, BUKAN $host.
#
# $host membuang nomor port. Ketika sistem dilayani di port selain 80 —
# mis. HTTP_PORT=8090 karena port 80 dipakai layanan lain — Laravel
# menerima `Host: localhost` dan membangun seluruh URL absolutnya tanpa
# port. Akibatnya redirect setelah login mengarah ke
# http://localhost/admin/... yang menuju server LAIN di mesin itu.
#
# Gejalanya sangat menyesatkan: login tampak gagal, padahal yang salah
# hanya alamat tujuan redirect-nya.
#
# $http_host adalah header Host apa adanya, lengkap dengan portnya.
# ---------------------------------------------------------------------

upstream absensi_api {
    server api:8080;
    keepalive 32;
}

upstream absensi_admin {
    server admin:8000;
    keepalive 16;
}

upstream jargon_web {
    server web:80;
    keepalive 16;
}

# Log absensi berguna untuk audit lapangan; sertakan waktu upstream agar
# keluhan "tablet lambat" bisa dibuktikan sumbernya.
#
# Didefinisikan di sini, di luar blok `server`. `log_format` hanya sah pada
# konteks `http`, dan berkas ini di-include dari dalam blok http — jadi
# tingkat teratas berkas ini SUDAH konteks http. Menaruhnya di dalam
# `server` membuat nginx menolak start dengan "log_format directive is not
# allowed here".
log_format absensi '$remote_addr - [$time_local] "$request" $status '
                   '${body_bytes_sent}b rt=${request_time}s '
                   'urt=${upstream_response_time}s "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # Payload absensi kecil (embedding ~8 KB sebagai JSON), tetapi pendaftaran
    # wajah mengirim gambar base64. 12 MB memberi ruang untuk itu sekaligus
    # menolak unggahan yang jelas tidak wajar.
    client_max_body_size 12M;

    # Jangan bocorkan versi nginx.
    server_tokens off;

    # Format `absensi` didefinisikan di atas, di konteks http.
    access_log /var/log/nginx/access.log absensi;

    include /etc/nginx/snippets/security-headers.conf;

    # CSP dipasang per-aplikasi di bawah, bukan satu nilai untuk semua:
    # dashboard Metronic menuntut 'unsafe-inline' yang tidak perlu diberikan
    # ke aplikasi Flutter maupun Swagger.
    #
    # Nilai di sini hanya jaring pengaman untuk lokasi yang belum diatur.
    add_header Content-Security-Policy
        "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
        always;

    # -----------------------------------------------------------------
    # Dashboard /admin
    # -----------------------------------------------------------------
    location /admin {
        proxy_pass http://absensi_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Ekspor laporan bulanan bisa memakan waktu; batas dinaikkan hanya
        # untuk dashboard, bukan untuk jalur absensi.
        proxy_read_timeout 120s;

        include /etc/nginx/snippets/security-headers.conf;

        # Metronic memakai atribut event dan <style> inline di hampir setiap
        # komponen, dan sebagian plugin-nya memanggil eval(). Keduanya tidak
        # dapat dihilangkan tanpa mengganti tema dashboard.
        #
        # blob: diperlukan halaman kios wajah untuk menyalurkan frame kamera
        # ke face-api.js.
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
            always;
    }

    # -----------------------------------------------------------------
    # Berkas statis dashboard.
    #
    # TABRAKAN PATH yang perlu diketahui: Metronic menaruh asetnya di
    # /assets/, dan Flutter web juga menaruh bundelnya di /assets/. Dua
    # aplikasi tidak bisa memiliki path yang sama.
    #
    # Yang mengalah dashboard: ASSET_URL=/admin membuat helper asset()
    # memancarkan /admin/assets/..., lalu blok ini membuang awalan
    # /admin sebelum meneruskan — karena `php artisan serve` melayani
    # berkas public/ di akar, bukan di bawah /admin.
    #
    # Location regex diprioritaskan di atas `location /admin`, jadi blok
    # ini menang tanpa perlu diurutkan.
    # -----------------------------------------------------------------
    location ~ ^/admin/(assets|build|storage)/ {
        rewrite ^/admin(/.*)$ $1 break;

        proxy_pass http://absensi_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~ ^/admin/(favicon\.ico|robots\.txt)$ {
        rewrite ^/admin(/.*)$ $1 break;

        proxy_pass http://absensi_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    # -----------------------------------------------------------------
    # Jalur panas absensi
    # -----------------------------------------------------------------
    location /v1/kiosk/ {
        proxy_pass http://absensi_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Batas waktu KETAT. Tablet punya antrean offline: lebih baik ia
        # menyimpan lokal dalam 10 detik daripada menahan siswa di depan
        # kamera selama satu menit.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Buffering dimatikan agar respons diteruskan segera setelah API
        # menjawab — setiap 100 ms terasa pada antrean pagi.
        proxy_buffering off;
    }

    # -----------------------------------------------------------------
    # Sisa API + dokumentasi + berkas
    # -----------------------------------------------------------------
    location ~ ^/(v1|docs|api-docs|files|health) {
        proxy_pass http://absensi_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;

        # API Rust memasang sebagian header ini sendiri (tower-http). Kalau
        # dibiarkan, Referrer-Policy terkirim dua kali dengan nilai berbeda dan
        # peramban memilih yang terakhir — jadi sumbernya dibuat satu saja.
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;

        include /etc/nginx/snippets/security-headers.conf;

        # Swagger UI menyuntik gaya dan skrip inline sendiri. Longgar hanya
        # pada dua hal itu; sisanya tetap terkunci ke origin ini.
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
            always;
    }

    # -----------------------------------------------------------------
    # Akar: aplikasi Jargon GO.
    #
    # Ditaruh paling akhir sebagai penangkap sisa. Flutter web adalah SPA
    # yang rutenya ditangani di sisi klien, jadi path apa pun yang tidak
    # cocok dengan blok di atas harus sampai ke index.html — penanganannya
    # ada di container `web` (jargon-fe/docker/web.conf).
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://jargon_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        include /etc/nginx/snippets/security-headers.conf;

        # CSP paling ketat di antara ketiganya: tanpa 'unsafe-inline' dan
        # tanpa 'unsafe-eval' untuk skrip.
        #
        # 'wasm-unsafe-eval' tetap perlu — CanvasKit mengompilasi WebAssembly,
        # dan tanpa izin itu aplikasi berhenti di layar putih. Ia jauh lebih
        # sempit daripada 'unsafe-eval': hanya WebAssembly, bukan eval() teks.
        #
        # Seluruh sumber daya same-origin karena build web memakai
        # --no-web-resources-cdn; tidak ada permintaan ke gstatic.
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
            always;
    }
}

# =====================================================================
# Contoh blok TLS untuk produksi.
#
# Tablet mengirim data biometrik; HTTPS bukan opsional di lapangan. Aplikasi
# Flutter build release menolak HTTP tanpa TLS (usesCleartextTraffic=false).
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name absensi.disdik.sumutprov.go.id;
#
#     ssl_certificate     /etc/letsencrypt/live/absensi.disdik.sumutprov.go.id/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/absensi.disdik.sumutprov.go.id/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     ... salin seluruh blok location di atas ...
# }
#
# server {
#     listen 80;
#     server_name absensi.disdik.sumutprov.go.id;
#     return 301 https://$host$request_uri;
# }
